<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Aspect Niche">
  <!--
    The tab icon: the seated constellation rabbit, the same mark the masthead
    and the mobile app icon use. It replaces the old star-graph, which belonged
    to the web demo's night-sky identity and is gone with it.

    Drawn at the mark's LOW density, which is the rule the mobile BrandMark
    follows below 40pt: the vertex dots are dropped and the stroke thickens,
    because a constellation does not survive being shrunk — at tab size the dots
    merge into the line and read as a muddy stroke. That is exactly what the old
    icon did. The nose accent is the one node that is never dropped.

    The stroke is ~26 units of this 512 box (47.7 before the 0.545 scale below).
    Heavier closes up the gap between the chest and the front leg at 64px;
    lighter goes faint at 16px. Geometry is public/landing/rabbit.svg, centred
    and scaled — keep the two in step if the drawing ever changes.
  -->
  <rect width="512" height="512" rx="102" fill="#0A0C18"/>
  <g transform="translate(66.8, 64.9) scale(0.545)"
     fill="none" stroke="#EFEDE8" stroke-width="47.7"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- back, haunch, head and ears -->
    <path d="M111 550L114 476 146 411 198 365 267 327 336 300 361 276 371 239 371 183 319 164 266 139 214 109 175 62 167 39 176 17 200 13 261 28 321 58 376 94 415 119 449 116 478 110 517 118 553 139 583 181 617 201 623 215 620 248 606 276 570 299 547 314 539 332 552 368 550 435 520 477"/>
    <!-- the second ear -->
    <path d="M371 190L319 188 275 177 229 157 198 134 179 109 179 90 187 76"/>
    <!-- tail -->
    <path d="M111 550L93 555 79 583 72 620 89 649 116 663 141 657 147 665"/>
    <!-- chest and front leg -->
    <path d="M315 512L348 535L372 570L385 612L380 628L410 630L428 650L437 671L414 684L203 688L163 680L147 665"/>
    <!-- hind leg -->
    <path d="M520 477L503 532L479 575L477 605L491 641L512 667L520 680L489 687L463 680L449 659L432 613L440 578L446 551"/>
    <circle cx="623" cy="215" r="32" fill="#BDB1F9" stroke="none"/>
  </g>
</svg>
